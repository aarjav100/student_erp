version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb+srv://aarjav100jain_db_user:QYUk2MC5q8YG9l6s@cluster0.cspq9lf.mongodb.net/?retryWrites=true&w=majority&appName=Cluster0
